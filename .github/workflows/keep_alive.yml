name: Keep Streamlit App Awake

on:
  schedule:
    # Runs at minute 0 past every 12th hour (e.g., 00:00 and 12:00 UTC)
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -s https://wbftscalculator.streamlit.app/ > /dev/null
